[tool.poetry]
name = "assurhabitat-ai"
version = "0.1.0"
description = "Systeme multi-agents IA pour la gestion des sinistres AssurHabitat"
authors = ["Ton Nom <ton.email@example.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.14" #python = "^3.10"
langgraph = ">=0.2.0"
langchain-core = ">=0.3.0"
langchain-community = ">=0.3.0"
pydantic = ">=2.0.0"
pandas = ">=2.0.0"
pillow = ">=10.0.0"
torch = ">=2.0.0,<3.0.0" #Remplacer  torch = "^2.13.0"
transformers = "^5.15.0"
accelerate = "^1.14.0"
langchain-ollama = "^1.1.0"
fastapi = "^0.141.1"
uvicorn = "^0.52.3"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
jupyter = "^1.0.0"
ipykernel = "^7.3.0"
httpx = "^0.28.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]