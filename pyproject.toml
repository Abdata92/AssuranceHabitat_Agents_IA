[tool.poetry]
name = "assurhabitat-ai"
version = "0.1.0"
description = "Systeme multi-agents IA pour la gestion des sinistres AssurHabitat"
authors = ["Ton Nom <ton.email@example.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
langgraph = ">=0.2.0"
langchain-core = ">=0.3.0"
langchain-community = ">=0.3.0"
pydantic = ">=2.0.0"
pandas = ">=2.0.0"
pillow = ">=10.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
jupyter = "^1.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"