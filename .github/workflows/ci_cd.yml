name: CI/CD Pipeline - AssurHabitat Multi-Agents

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # --------------------------------------------------
  # 1. PHASE DE TESTS ET QUALITÉ DU CODE (CI)
  # --------------------------------------------------
  test-and-eval:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installation de Poetry
        run: pip install poetry

      - name: Installation des dépendances
        run: poetry install --no-interaction

      - name: Linter et vérification du code
        run: |
          poetry run python -m py_compile src/api.py
          poetry run python -m py_compile src/agents/orchestration.py

      - name: Exécution des tests unitaires et d'évaluation
        run: |
          poetry run python src/evaluate.py
      
      - name: Run PyTest Suite
        run: |
          poetry run pytest -v

  # --------------------------------------------------
  # 2. PHASE DE BUILD DOCKER ET REGISTRY (CD)
  # --------------------------------------------------
  build-and-push:
    needs: test-and-eval
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # Ajouter les permissions requises pour GHCR
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Mettre le nom du dépôt en minuscules
        id: string
        run: |
          echo "REPO_LOWERCASE=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Connexion au GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et Push de l'image Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWERCASE }}/assurhabitat-api:latest
            ghcr.io/${{ env.REPO_LOWERCASE }}/assurhabitat-api:${{ github.sha }}
