version: '3.8'

services:
  # Service Moteur d'Inférence LLM / VLM
  ollama:
    image: ollama/ollama:latest
    container_name: assurhabitat-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Service API Multi-Agents AssurHabitat
  api:
    build: .
    container_name: assurhabitat-api
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      - ollama
    restart: always

volumes:
  ollama_storage: